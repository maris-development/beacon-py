name: Release

on:
  # Run when you push any tag
  push:
    tags:
      - "*"
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Determine version from tag
        id: get_version
        run: |
          # Strip off the "refs/tags/" prefix to get just "1.2.3" (or whatever you tagged)
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Version is $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine mypy

      - name: Set version from tag
        run: |
          sed -i "s/version = .*/version = \"${{ steps.get_version.outputs.version }}\"/" pyproject.toml

      - name: Build sdist and wheel
        # No flags: builds the sdist, then builds the wheel *from* that sdist,
        # which verifies the sdist is complete enough to rebuild the package.
        run: python -m build --outdir dist

      - name: Check artifacts
        run: |
          ls -l dist
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
